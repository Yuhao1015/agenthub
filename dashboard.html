  $("#pv-title").textContent=p.path;
  const url=fileUrl(p.task,p.path);
  $("#pv-dl").href=url;$("#pv-dl").setAttribute("download",p.path.split(/[\\/]/).pop());
  const body=$("#pv-body");body.innerHTML="";
  // DEMO 模式的事件是前端伪造的，磁盘上并没有这些文件，说清楚而不是让
  // 用户对着一个永远转不出来的加载态猜
  if(S.mode!=="live"){
    body.innerHTML=note("DEMO 模式没有真实文件","这些交付物是模拟事件里的占位数据。"+
      "用 python3 serve.py 起服务、真实跑一次任务，就能在这里预览真产出。");
    icons();return;}
  if(PV_IMG.test(p.path)){const img=document.createElement("img");img.src=url;img.alt=p.path;
    img.onerror=()=>{body.innerHTML=note("图片打不开","文件可能已经被删除或移动了。");icons();};
    body.appendChild(img);icons();return;}
  if(PV_HTML.test(p.path)||PV_PDF.test(p.path)){
    const fr=document.createElement("iframe");fr.src=url;
    // 生成出来的页面是 agent 写的，按不可信内容对待：allow-scripts 让页面
    // 里的 JS 还能跑（不然预览一个交互页面等于白看），但不给
    // allow-same-origin，它就碰不到本页 DOM / localStorage。PDF 走浏览器
    // 内置阅读器，sandbox 会把它关掉，所以只对 HTML 加。
    if(PV_HTML.test(p.path))fr.setAttribute("sandbox","allow-scripts allow-popups");
    body.appendChild(fr);icons();return;}
  const isText=PV_TEXT.test(p.path)||PV_MD.test(p.path);
  if(!isText){
    body.innerHTML=note("这种格式浏览器没法直接预览",
      "docx / pptx / xlsx 这类二进制文档需要专门的解析器，这里不做。"+
      "点右上角「下载」用本机应用打开。");
    icons();return;}
  body.innerHTML='<div class="pv-pad" style="color:var(--dim);font-size:12.5px">读取中…</div>';
  fetch(url).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
    .then(text=>{
      if(!S.preview||S.preview.path!==p.path)return;   // 期间换了文件
      const d=document.createElement("div");d.className="pv-pad";
      if(PV_MD.test(p.path)){d.classList.add("pv-md");d.innerHTML=mdToHtml(text);}
      else{d.classList.add("pv-txt");d.textContent=text;}
      body.innerHTML="";body.appendChild(d);})
    .catch(err=>{body.innerHTML=note("读不到这个文件",
      String(err.message||err)+"。文件可能已被删除，或者当前不是 LIVE 服务模式。");icons();});
  function note(title,text){return '<div class="pv-note"><b>'+esc(title)+'</b>'+esc(text)+'</div>';}
}
/* 极简 Markdown 渲染：标题/列表/引用/分割线/代码块/行内样式。
   故意不引 CDN 库——这个前端是单文件零构建，双击也要能打开。
   一切先 esc()，所以 .md 里夹带的 HTML 只会显示成文本，不会执行。 */
function mdToHtml(src){
  const blocks=[];
  src=String(src).replace(/```[\s\S]*?(?:```|$)/g,m=>{
    // 先把围栏代码块整段抽走，占位符用 NUL 包起来：换成可见字符
    // （比如空格包数字）会把正文里「共 12 个文件」这种普通文本误还原
    const body=m.replace(/^```[^\n]*\n?/,"").replace(/```\s*$/,"");
    return "\u0000"+(blocks.push('<pre class="pv-code">'+esc(body)+"</pre>")-1)+"\u0000";});
  const safeHref=u=>/^(https?:|\/|#|\.)/i.test(u)?u.replace(/"/g,"%22"):"#";
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a)=>"<i>[图片 "+a+"]</i>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>
      '<a href="'+safeHref(u)+'" target="_blank" rel="noopener">'+t+"</a>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  const out=[];let list=null;
  const closeList=()=>{if(list){out.push("</"+list+">");list=null;}};
  for(const raw of src.split("\n")){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){closeList();continue;}
    if(/^\u0000\d+\u0000$/.test(line.trim())){closeList();out.push(line.trim());continue;}
    let m;
    if((m=line.match(/^(#{1,6})\s+(.*)$/))){closeList();
      out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");continue;}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){closeList();out.push("<hr>");continue;}
    if((m=line.match(/^\s*[-*+]\s+(.*)$/))){
      if(list!=="ul"){closeList();out.push("<ul>");list="ul";}
      out.push("<li>"+inline(m[1])+"</li>");continue;}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(list!=="ol"){closeList();out.push("<ol>");list="ol";}
      out.push("<li>"+inline(m[1])+"</li>");continue;}
    if((m=line.match(/^>\s?(.*)$/))){closeList();
      out.push("<blockquote>"+inline(m[1])+"</blockquote>");continue;}
    closeList();out.push("<p>"+inline(line)+"</p>");
  }
  closeList();
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]!==undefined?blocks[+i]:m);
}
function pvNote(title,text){return '<div class="pv-note"><b>'+esc(title)+'</b>'+esc(text)+'</div>';}
/* ---------- git diff view (live, worktree vs HEAD) ---------- */
async function openDiff(){
  const p=S.preview;
  if(!p||S.mode!=="live")return;
  $("#pv-diff").disabled=true;
  try{
    const res=await fetch("/file/diff?task="+encodeURIComponent(p.task)+"&path="+encodeURIComponent(p.path));
    const d=await res.json().catch(()=>({}));
    if(!res.ok){hint("diff 失败："+((d&&d.error)||res.status));return;}
    S.pvDiff=true;pvShown=null;
    const body=$("#pv-body");
    if(d.ok===false){
      body.innerHTML=pvNote(d.error,"这不是文件损坏：要么本机没装 git，要么工作目录不是 git 仓库（在 workdir 里 git init 之后再来看）。");
    }else{
      body.innerHTML='<pre class="pv-txt" style="white-space:pre;overflow:auto">'+esc(d.diff)+
        (d.truncated?'\n\n—— diff 过长已截断，用本机 git diff 查看完整内容 ——':'')+'</pre>';
      if(d.note)body.innerHTML+='<div class="pv-note">'+esc(d.note)+'</div>';
    }
    $("#pv-diff").hidden=true;$("#pv-file").hidden=false;
  }catch(e){hint("diff 失败："+e.message,true)}
  finally{$("#pv-diff").disabled=false;}
}
$("#pv-diff").onclick=openDiff;
$("#pv-file").onclick=()=>{S.pvDiff=false;pvShown=null;renderPreview();};
$("#pv-close").onclick=()=>{S.preview=null;S.pvDiff=false;pvShown=null;closeReview();renderPreview();};

/* ---------- 审阅改动（change-safety-net.md §5.4）：复用右侧预览面板 ---------- */
const RV_ST={A:"新增",M:"修改",D:"删除"};
const RV_KIND={run:"运行本身",rerun:"重跑",followup:"追问"};
let rvShown=null;
function openReview(runId){
  S.review={run:runId||""};S.preview=null;S.pvDiff=false;pvShown=null;
  S.reviewDiff=null;S.reviewUnsel=new Set();S.reviewResult=null;rvShown=null;
  renderPreview();loadChanges(runId);
}
function closeReview(){S.review=null;S.reviewDiff=null;rvShown=null;}
function renderReview(){
  const runId=S.review.run,d=S.changes[runId];
  // renderAll() 每次轮询都会走到这里：跟 renderPreview 一样按 key 幂等
  const key=[runId,S.changesVer,S.reviewBusy,S.busy,S.reviewResult?S.reviewResult.ts:"",
    S.reviewDiff?S.reviewDiff.seg+"\n"+S.reviewDiff.path:""].join("|");
  if(key===rvShown)return;
  rvShown=key;
  $("#pv-wrap").classList.add("on");
  $("#pv-kicker").textContent="审阅改动";
  const sess=S.sessions.find(x=>(x.runId||"")===runId);
  $("#pv-title").textContent=sess?sess.goal:("运行 "+(runId||"（当前）"));
  $("#pv-dl").hidden=true;
  const body=$("#pv-body");body.innerHTML="";
  if(S.mode!=="live"){body.innerHTML=pvNote("DEMO 模式没有真实改动","真实跑一次之后，这里能看到那次运行改了哪些文件。");icons();return;}
  if(!d){body.innerHTML='<div class="pv-pad" style="color:var(--dim);font-size:12.5px">读取中…</div>';return;}
  if(d.error){body.innerHTML=pvNote("读不到改动记录",d.error);icons();return;}
  if(S.reviewDiff)renderReviewDiff(body,runId,S.reviewDiff);
  else renderReviewList(body,runId,d);
}
function rvNotes(seg){
  const out=[];
  if(seg.error)out.push("这一段看不了："+seg.error);
  else if(seg.open)out.push("这一段还没结束（运行还在进行）。");
  if(seg.note)out.push(seg.note);
  if(seg.incomplete)out.push("有任务的检查点没拍到：这一段只能审阅，不能回滚。");
  if((seg.skipped||[]).length)
    out.push("这些文件不在检查点里："+seg.skipped.map(s=>s.path||s.reason).join("、"));
  return out;
}
function rvGroup(box,label,files,seg){
  const lab=document.createElement("div");lab.className="rv-grp";lab.textContent=label;box.appendChild(lab);
  for(const f of files){
    const row=document.createElement("div");row.className="rv-f";
    const cb=document.createElement("input");cb.type="checkbox";cb.className="rv-cb";
    cb.dataset.path=f.path;
    cb.disabled=!!f.nested||!seg.can_rollback;
    cb.checked=!cb.disabled&&!S.reviewUnsel.has(f.path);
    cb.onchange=()=>{
      if(cb.checked)S.reviewUnsel.delete(f.path);else S.reviewUnsel.add(f.path);
      // 同一个文件可能出现在好几段里：勾选跟着路径走
      for(const other of document.querySelectorAll("#pv-body .rv-cb"))
        if(other.dataset.path===f.path&&!other.disabled)other.checked=cb.checked;
    };
    const st=document.createElement("span");st.className="rv-st st-"+f.status;
    st.textContent=RV_ST[f.status]||f.status;
    const p=document.createElement("button");p.className="rv-path";p.textContent=f.path;
    p.title="看这个文件在这一段里的改动";
    p.onclick=()=>{S.reviewDiff={seg:seg.n,path:f.path};renderPreview();};
    const n=document.createElement("span");n.className="rv-n";
    n.textContent=f.nested?"嵌套仓库，不回滚":f.binary?"二进制":"+"+f.added+" −"+f.deleted;
    row.append(cb,st,p,n);box.appendChild(row);
  }
}
function rvResult(r){
  const box=document.createElement("div");box.className="rv-seg";
  const h=document.createElement("h4");box.appendChild(h);
  h.textContent=(r.kind==="undo"?(r.undone?"已撤销回滚":"撤销未完成"):"回滚完成")+"：恢复 "+r.restored.length+" 个文件"+
    (r.skipped.length?"，跳过 "+r.skipped.length+" 个":"");
  const line=text=>{const el=document.createElement("div");el.className="rv-note";
    el.textContent=text;box.appendChild(el);};
  r.restored.forEach(p=>line("恢复 · "+p));
  r.skipped.forEach(s=>line("跳过 · "+(s.path||"")+" —— "+s.reason));
  if(r.error)line(r.kind==="undo"?r.error:"中途出错："+r.error+"。可以用「撤销最近一次回滚」退回去。");
  else if(r.kind==="undo"&&!r.undone)line("仍有文件未撤销，处理跳过原因后可以重试。");
  return box;
}
function renderReviewList(body,runId,d){
  const note=(text,parent)=>{const el=document.createElement("div");el.className="rv-note";
    el.textContent=text;parent.appendChild(el);};
  const top=document.createElement("div");top.className="rv-top";body.appendChild(top);
  top.textContent="运行期间你自己改的文件也会出现在这里。回滚只恢复这次运行留下的样子，"+
    "之后又被改过的文件会跳过；工作目录之外的事（装包、联网、git push）不在检查点里。";
  if(!d.checkpoints.on)note("这次运行不能一键回滚："+(d.checkpoints.reason||"没有检查点"),top);
  if(S.reviewResult)body.appendChild(rvResult(S.reviewResult));
  const paths=new Set();
  for(const seg of d.segments.slice().reverse()){          // 新的段在上
    const box=document.createElement("div");box.className="rv-seg";body.appendChild(box);
    const h=document.createElement("h4");box.appendChild(h);
    h.textContent=(RV_KIND[seg.kind]||seg.kind)+(seg.task_id?" "+seg.task_id:"")+
      " · 第 "+seg.n+" 段 · "+(seg.files.length?seg.files.length+" 个文件":"没有改动");
    for(const t of rvNotes(seg))note(t,box);
    const claimed=new Set();
    for(const g of seg.tasks){
      const files=seg.files.filter(f=>g.paths.includes(f.path));
      if(!files.length)continue;
      rvGroup(box,"任务 "+g.id+" · "+g.title,files,seg);
      files.forEach(f=>claimed.add(f.path));
    }
    const rest=seg.files.filter(f=>!claimed.has(f.path));
    if(rest.length)rvGroup(box,seg.tasks.length?"没归到任务上的改动（规划阶段，或你自己改的）":"改动的文件",rest,seg);
    if(seg.can_rollback)seg.files.forEach(f=>{if(!f.nested)paths.add(f.path);});
  }
  const foot=document.createElement("div");foot.className="rv-foot";body.appendChild(foot);
  const rollbacks=d.rollbacks||[],last=rollbacks[rollbacks.length-1];
  const pending=!!(last&&!last.undone&&last.pre&&last.post&&(last.restored||[]).length);
  const rb=document.createElement("button");rb.className="btn primary";
  rb.innerHTML='<i data-lucide="undo-2"></i>回滚所选文件';
  rb.disabled=!paths.size||S.reviewBusy||S.busy||pending;
  rb.onclick=()=>rollbackSelected(runId,[...paths].filter(p=>!S.reviewUnsel.has(p)));
  foot.appendChild(rb);
  if(last&&!last.undone){
    const ub=document.createElement("button");ub.className="btn";
    ub.innerHTML='<i data-lucide="redo-2"></i>撤销最近一次回滚';
    ub.disabled=S.reviewBusy||S.busy;ub.onclick=()=>undoRollback(runId);
    foot.appendChild(ub);
  }
  if(S.busy)note("有运行在进行，结束后才能回滚。",foot);
  if(pending)note("先撤销上一次回滚，才能再回滚别的文件。",foot);
  icons();
}
async function renderReviewDiff(body,runId,q){
  const head=document.createElement("div");head.className="rv-top rv-diffhead";
  const back=document.createElement("button");back.className="btn ghost";
  back.innerHTML='<i data-lucide="arrow-left"></i>返回清单';
  back.onclick=()=>{S.reviewDiff=null;renderPreview();};
  const name=document.createElement("span");name.className="rv-path";name.textContent=q.path;
  head.append(back,name);
  const pre=document.createElement("pre");pre.className="pv-txt pv-pad";
  pre.style.cssText="white-space:pre;overflow:auto";pre.textContent="读取中…";
  body.append(head,pre);icons();
  try{
    const r=await fetch("/run/changes/diff?run="+encodeURIComponent(runId)+"&seg="+
      encodeURIComponent(String(q.seg))+"&path="+encodeURIComponent(q.path));
    const d=await r.json().catch(()=>({}));
    if(S.reviewDiff!==q)return;                 // 等它回来之前已经换了文件
    pre.textContent=(!r.ok||d.ok===false)
      ?"看不了这个文件的改动："+((d&&d.error)||("HTTP "+r.status))
      :(d.diff||"（没有文本差异，可能是二进制文件）")+(d.truncated?"\n\n—— diff 过长已截断 ——":"");
  }catch(e){if(S.reviewDiff===q)pre.textContent="看不了这个文件的改动："+(e.message||e);}
}
async function rollbackSelected(runId,paths){
  if(!paths.length){hint("没有勾选任何文件");return;}
  if(!window.confirm("恢复到这次运行改动之前；之后又被改过的文件会跳过。\n确定回滚所选的 "+
    paths.length+" 个文件？"))return;
  await reviewPost("/run/rollback",{run:runId,paths:paths},"rollback");
}
async function undoRollback(runId){
  if(!window.confirm("撤销最近一次回滚？回滚之后又被改过的文件会跳过。"))return;
  await reviewPost("/run/rollback/undo",{run:runId},"undo");
}
async function reviewPost(url,payload,kind){
  S.reviewBusy=true;renderPreview();
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok && !(kind==="undo"&&d&&d.undone===false)){
      hint((kind==="undo"?"撤销失败：":"回滚失败：")+((d&&d.error)||r.status));return;}
    S.reviewResult={kind:kind,ts:Date.now(),restored:d.restored||[],skipped:d.skipped||[],
      error:d.error||"",undone:d.undone};
  }catch(e){hint("请求失败："+(e.message||e));}
  finally{S.reviewBusy=false;await loadChanges(payload.run);}
}

/* ---------- master render ---------- */
/* ---------- 草稿区什么时候不能操作 ----------
   原本七个控件在 renderAll 里各写一遍 `S.sendPending||S.restoringSessions`。
   加 restoringSessions 那次就漏改过 #mode-btn —— 七份重复的布尔式，漏一个
   不会有任何提示，界面只是安静地允许了一次本不该允许的操作。
   现在判据一处定义、控件一处登记：新增控件加进 DRAFT_CONTROLS，新增条件
   改 draftLocked()，两者都不必动第二个地方。 */
const DRAFT_CONTROLS=["#prompt","#mode-btn","#sw-manager-agent","#sw-manager","#sw-assign","#sw-gate"];
function draftLocked(){
  // sendPending：这一轮经理还在飞（本页发的，或刷新后从服务端恢复出来的）。
  // restoringSessions：开机恢复还没落定，此刻界面状态未必是服务端的真相。
  return S.restoringSessions||(S.mode==='live'&&window.GoalQueue?.selected()?GoalQueue.draftPending():S.sendPending);
}

function selectedSession(){
  return S.mode==='live'&&window.GoalQueue?.selected()?GoalQueue.session():S.sessions[S.activeIdx];
}

function renderAll(){
  const sess=selectedSession();
  view=computeView(sess);
  renderSide();renderChat(sess);renderPane();renderDrawer();renderPreview();
  const done=[...view.tasks.values()].filter(t=>t.status==="done").length;
  $("#run-text").textContent=view.tasks.size
    ? ({running:"运行中",done:"已完成",failed:"有失败",cancelled:"已取消",idle:"待命"}[view.status]||"")+" · "+done+"/"+view.tasks.size+" · "+costText(view.cost,view.costComplete)
    : "待命";
  const locked=draftLocked();
  for(const sel of DRAFT_CONTROLS)$(sel).disabled=locked;
  $("#new-btn").disabled=S.restoringSessions||(S.mode!=='live'&&S.sendPending);
  for(const control of $("#manager-options").querySelectorAll("select,input,button"))control.disabled=locked;
  // 发送多一条：LIVE 模式下有 run 在跑时也不能发。其余条件必须走同一个
  // 判据，否则又变回七份各自维护的布尔式。
  $("#send").disabled=locked||runBlocksSend();
  const queuePosting=S.mode==='live'&&window.GoalQueue?.requestPending();
  $("#send").classList.toggle('goal-sending',!!queuePosting);
  $("#send").setAttribute('aria-busy',queuePosting?'true':'false');

async function waitForPrefs(){

  // `await prefsSave` captures one Promise.  A programmatic change (or an
  // already queued change event) can append a newer save while that Promise
  // is pending, so keep waiting until the observed tail is still the tail.
  while(true){

/* 选择题答案仍渲染成普通文本；结构化答案只是 /chat 的增量元数据。 */
function normalizeChoiceAnswers(value){
  if(!value||typeof value!=="object"||Array.isArray(value))return {};
  const answers={};
  for(const [key,answer] of Object.entries(value))
    if(typeof key==="string"&&typeof answer==="string")
      answers[key.slice(0,100)]=answer.slice(0,2000);
  return answers;
}
function freezeOpenChoices(reason){
  const goal=S.mode==='live'?window.GoalQueue?.selected():null;
  for(const message of goal?GoalQueue.chatMessages(goal):S.preChat)
    if(message.card&&message.card.kind==="choices"&&!message.card.frozen){
      message.card.frozen=true;
      if(reason)message.card.skipped=reason;
    }
}
function submitChoices(card){
  if(draftLocked()){hint("上一条消息仍在发送，请稍候");return;}
  const lines=[];
  for(const question of card.questions){
    const answer=card.answers[question.id]||"";
    const extra=(card.answers["__other__"+question.id]||"").trim();
    if(!answer&&!extra)continue;
    const options=question.options||[];
    const selected=choiceSelections(answer,options);
    if(options.length&&!selected.length)continue;
    const chosen=options.find(option=>option.other&&selected.includes(option.label));
    if(chosen&&chosen.other&&!extra){hint("选择“其他”后请补充说明");return;}
    const rendered=!options.length?answer.trim():selected.filter(label=>!options.some(option=>option.label===label&&option.other)).concat(chosen?[extra]:[]).join("；");
    if(!rendered)continue;
    lines.push(question.question+"："+rendered);
  }
  if(!lines.length){hint("至少答一题，或者直接在输入框里说");return;}
  if(!setPromptText(lines.join("\n")))return;
  S.pendingChoiceAnswers=normalizeChoiceAnswers(card.answers);
  card.frozen=true;
  sendPrompt();
}

/* ---------- 经理思考进度（spec：见 CLAUDE.md §6.14） ----------
   claude -p 的 thinking 块内容是空的（2026-08-31 复测），所以这里
   **没有推理文本可展示**，只有推理的形状：想了几轮、读了什么、何时
   开始写回复，以及每步耗时。绝不编造「经理正在考虑…」这类旁白。 */
const MPROG_ICON=[[/思考/,"brain"],[/^Read\(/,"file-text"],
  [/^(Write|Edit)\(/,"file-pen"],[/^Bash\(/,"terminal"],[/^Glob\(|^Grep\(/,"search"]];
function mprogIcon(detail){
  for(const [re,ic] of MPROG_ICON)if(re.test(detail))return ic;
  return "sparkles";   // 其余（含正在成文的文本预览）
}
function renderManagerProgress(steps,startTs,live){
  /* 耗时语义：on_event 在内容块**完成**时才触发，所以 steps[i].ts 是那一步
     的结束时刻 —— 这一步花了多久 = 它的 ts 减去上一步的 ts（第一步减去本轮
     开始时间）。用「下一步的 ts 减自己」是错的，那算的是下一步的时长。 */
  const box=document.createElement("div");box.className="mprog";
  if(live){const label=document.createElement("strong");label.className="work-shimmer";label.textContent="经理思考中";box.append(label);}
  const row=(detail,secs,cur)=>{
    const r=document.createElement("div");r.className="st"+(cur?" cur":"");
    const ic=document.createElement("i");ic.setAttribute("data-lucide",mprogIcon(detail));
    ic.style.cssText="width:12px;height:12px;flex:none";
    const d=document.createElement("span");d.className="d";
    d.textContent=detail;                    // LLM 侧内容 -> textContent
    const el=document.createElement("span");el.className="el";
    el.textContent=Math.max(0,Math.round(secs))+"s";
    r.append(ic,d,el);box.appendChild(r);
  };
  let prev=startTs;
  for(const s of steps){row(s.detail,s.ts-prev,false);prev=s.ts;}
  /* 还没结束的那一步：第一个 thinking 块要跑 8-10 秒才闭合，这段静默期
     一个事件都没有 —— 正是最需要「它还活着」的时候。用本轮开始/上一步
     到现在的时间填上，这是实测得到的真实数字，不是编的旁白。 */
  if(live)row(steps.length?"继续思考…":"正在思考…",(Date.now()/1000)-prev,true);
  return box;
}
function newSessionId(){
  // 跟服务端同规格的 12 位十六进制；crypto 不可用时退回 Math.random
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint8Array(6);crypto.getRandomValues(a);
    return [...a].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return Math.random().toString(16).slice(2,14).padEnd(12,"0");
}
/* ---------- 轮询登记处 ----------
   三条轮询原本各存各的句柄（let mprogTimer / let pollTimer /
   S.restoredSessionTimer）、各写各的启停、各自决定要不要挂页面生命周期。
   于是「pagehide 把它停了、却没人负责重新装上」这种缺陷只能一条一条犯 ——
   那个把整个界面永久锁死的缺陷正是这么来的（见 §7 与 docs/decisions/
   serve-and-frontend.md）。收成一处之后停与恢复是对称的：新加一条轮询
   不可能只被停掉而不被恢复，因为两边都不再逐条点名。 */
const Timers={
  _h:Object.create(null),
  start(name,fn,ms){this.stop(name);this._h[name]=setInterval(fn,ms);},
  stop(name){const h=this._h[name];if(h!==undefined){clearInterval(h);delete this._h[name];}},
  running(name){return this._h[name]!==undefined;},
  stopAll(){for(const name of Object.keys(this._h))this.stop(name);},
};

function startManagerProgress(){
  stopManagerProgress();
  S.mgrProgress=[];S.mgrStart=Date.now()/1000;S.mgrLive=true;
  Timers.start("progress",async()=>{
    // 每秒都重绘：就算一个新步骤都没来，正在进行那一行的秒数也要往上走
    try{
      if(S.chatSession){
        const r=await fetch("/chat/progress?session_id="+encodeURIComponent(S.chatSession));
        if(r.ok)S.mgrProgress=(await r.json()).steps||[];
      }
    }catch(_){/* 轮询挂了只是看不到进度，对话本身不受影响 */}
    renderAll();
  },1000);
}
function stopManagerProgress(){
  Timers.stop("progress");
  S.mgrProgress=[];S.mgrLive=false;
}

function historyToChat(history){
  const items=Array.isArray(history)?history:[];
  return items.filter(item=>item&&typeof item==="object").map(item=>{
    const message={role:item.role==="manager"?"manager":"user",
      text:String(item.text||""),ts:Number(item.ts)||nowTs(),card:null};
    const questions=(Array.isArray(item.questions)?item.questions:[])
      .filter(q=>q&&typeof q==="object"&&q.question)
      .map(q=>({id:String(q.id||"").slice(0,100),question:String(q.question||""),
        options:(Array.isArray(q.options)?q.options:[])
          .filter(o=>o&&typeof o==="object"&&o.label!=null)
          .map(o=>({label:String(o.label||""),detail:String(o.detail||""),
            other:o.other===true}))}));
    if(questions.length&&questions.some(q=>q.options.length)){
      message.text="";
      message.card={kind:"choices",questions:questions,
        answers:normalizeChoiceAnswers(item.answers),
        frozen:item.answered===true};
    }
    return message;
  });
}

// 返回值是「这份快照用上了没有」。调用方要靠它决定要不要开轮询：编号无效
// 时直接开轮询，会让每个 tick 都走同一条 return 并再弹一次提示，1 秒一条，
// 永远停不下来。
function applyActiveSnapshot(active){
  if(!active||typeof active!=="object")return false;
  const sessionId=String(active.session_id||"");
  if(window.GoalQueue?.records.has(sessionId))return false;
  if(!/^[a-f0-9]{12}$/.test(sessionId)){
    hint("会话恢复失败：会话编号无效");
    return false;
  }
  const followActive=S.followLatest||S.activeIdx<0||S.activeIdx===S.sessions.length;
  const localOnly=S.preChat.filter(m=>m.local);
  S.chatSession=sessionId;
  S.sendPending=active.pending===true;
  S.preChat=historyToChat(active.history);
  if(active.pending)
    S.preChat.push({role:"manager",text:"__typing__",ts:nowTs(),restoredPending:true});
  S.preChat.push.apply(S.preChat,localOnly);
  if(followActive){S.followLatest=true;S.activeIdx=S.sessions.length;}
  return true;
}

function clearRestoredDraftState(){
  S.preChat=S.preChat.filter(m=>m.local);
  S.chatSession=null;S.sendPending=false;S.pendingChoiceAnswers=null;
}

async function restoreManagerSessions(){
  S.restoringSessions=true;
  try{
    const response=await fetch("/chat/session/current",{cache:"no-store"});
    if(!response.ok){
      const error=await response.json().catch(()=>({}));
      hint("会话恢复失败："+((error&&error.error)||response.status));
      return;
    }
    const data=await response.json();
    if(data.run&&/^[a-f0-9]{8}$/.test(String(data.run.run_id||""))){
      S.managerChatsByRun[data.run.run_id]=historyToChat(data.run.history).map(m=>({...m,restoredManager:true}));
    }
    if(data.active){
      if(applyActiveSnapshot(data.active)&&data.active.pending)startRestoredManagerPolling();
      else{stopRestoredManagerPolling();stopManagerProgress();}
    }else{
      stopRestoredManagerPolling();stopManagerProgress();
      clearRestoredDraftState();
    }
  }catch(_){
    hint("会话恢复失败：连不上 serve.py");
    /* boot continues; live polling will own the persistent disconnected state */
  }finally{S.restoringSessions=false;window.GoalQueue?.reconcileRestored();}
}

/* ---------- restored pending turn ---------- */

function stopRestoredManagerPolling(){
  Timers.stop("session");
}

// 服务端答了但答的是错误（比如会话文件损坏 -> 500）是个持久状态，重试多少
// 次都一样。不放弃的话就是：每秒一次请求、界面全禁用、一句提示都没有 ——
// 跟「经理在慢慢想」长得一模一样。放弃时必须把 sendPending 放开，否则没人
// 再能清它；真有一轮在飞，服务端的 _chat_inflight 会用 409 兜住重复发送。
// 网络异常不计数：那是 pollLive 的职责，且经理一轮本来就要几十秒。
let pollFail=0;
async function pollRestoredManagerTurn(){
  const expectedSession=S.chatSession;
  try{
    const response=await fetch("/chat/session/current",{cache:"no-store"});
    if(!response.ok){
      if(++pollFail>=5){
        stopRestoredManagerPolling();stopManagerProgress();
        S.sendPending=false;
        hint("读不出会话状态（"+response.status+"）—— 刷新页面重试");
        renderAll();
      }
      return;
    }
    pollFail=0;
    const data=await response.json();
    if(S.chatSession!==expectedSession)return;
    if(data.run&&/^[a-f0-9]{8}$/.test(String(data.run.run_id||"")))
      S.managerChatsByRun[data.run.run_id]=historyToChat(data.run.history).map(m=>({...m,restoredManager:true}));
    if(data.active){
      if(!applyActiveSnapshot(data.active)||!data.active.pending){
        stopRestoredManagerPolling();
        stopManagerProgress();
      }
    }else{
      stopRestoredManagerPolling();
      stopManagerProgress();
      clearRestoredDraftState();
    }
    renderAll();
  }catch(_){/* pollLive reports connectivity */}
}

function startRestoredManagerPolling(){
  pollFail=0;
  startManagerProgress();
  Timers.start("session",pollRestoredManagerTurn,1000);
}

// 离开页面：三条一起停，不用记得哪条该停。
window.addEventListener("pagehide",()=>Timers.stopAll());
// bfcache 把整页冻住再原样恢复，boot() 不会重跑 —— 所以上面停掉的必须在
// 这里对称地装回来，否则「进设置再返回」（本功能就是为它做的）之后
// S.sendPending 永远清不掉，整个界面锁死，只能硬刷新。
// live 是无状态轮询，直接重启；session/progress 的真相在服务端，所以走
// restoreManagerSessions() 重新推导，而不是盲目重装一条可能已经过期的轮询。
window.addEventListener("pageshow",e=>{
  if(!e.persisted)return;
  if(S.mode==="live")startLive();
  restoreManagerSessions().then(renderAll);});

// 运行中任务的交互通道：LIVE 有运行在跑时只放行「@任务id 内容」追问。以前这里
// 一律 return，排队 → AWAITING_INPUT 那整条后端能力从界面上到不了（bug B8）
const FOLLOW_UP_RE=/^@(\S+)\s+([\s\S]+)$/;
function runBlocksSend(){
  const goal=S.mode==='live'?window.GoalQueue?.selected():null;
  if(goal){
    if(goal.draft||goal.state==='awaiting_input')return false;
    return !goal.run_id||!FOLLOW_UP_RE.test($("#prompt").value.trim());
  }
  return S.busy&&S.mode==="live"&&!FOLLOW_UP_RE.test($("#prompt").value.trim());
}
async function sendPrompt(){
  const ta=$("#prompt"),text=ta.value.trim();
  const choiceAnswers=S.pendingChoiceAnswers;
  const goal=S.mode==='live'?window.GoalQueue?.selected():null;
  if(goal){
    if(!text||draftLocked()||runBlocksSend())return;
    if(goal.run_id)return GoalQueue.followup(text);
    return goal.draft?GoalQueue.submit(text):GoalQueue.reply(text,choiceAnswers);
  }
  if(!text||S.sendPending)return;
  if(runBlocksSend()){hint("运行中只能用「@任务id 内容」追问；新目标等这次运行结束再发");return;}
  S.sendPending=true;renderAll();
  try{
  if(S.mode==="live"){
    const prefsOk=await waitForPrefs();
    if(!prefsOk){hint("设置尚未保存，已阻止启动；请确认连接后重试");return;}
    ensureNotifyPermission();   // real user gesture: the
    // only place Safari reliably shows the permission prompt (pollLive's
    // setInterval callback is not a user gesture -- it would silently no-op)
  }
  ta.value="";autoGrow();
  if(S.mode==="demo"){
    S.pendingGoal={text:text,ts:nowTs()};S.followLatest=true;renderAll();
    setTimeout(()=>demoRun(text),700);return;}
  // @taskid ... -> deep follow-up on that task's agent session
  const m=text.match(FOLLOW_UP_RE);
  S.followLatest=true;
  freezeOpenChoices("你直接回复了");
  // 追问属于那次运行：记进最新会话的时间线（异步回复 task_message_replied 也记在
  // 那里）。放进 preChat 的话它排在回复后面，还会被挪进下一次运行
  const followSess=m&&!S.chatSession?S.sessions[S.sessions.length-1]:null;
  const log=followSess?followSess.chat:S.preChat;
  const typing={role:"manager",text:"__typing__",ts:nowTs()};
  log.push({role:"user",text:text,ts:nowTs()},typing);
  renderAll();
  const drop=()=>{
    if(followSess){const i=log.indexOf(typing);if(i>=0)log.splice(i,1);}
    else S.preChat=S.preChat.filter(x=>x.text!=="__typing__");};
  try{
    let res,data;
    if(m){
      res=await fetch("/task/"+encodeURIComponent(m[1])+"/message",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m[2]})});
      data=await res.json();drop();
      if(data.cost_complete===false)log.push({role:"manager",text:"API 费用未知，显示金额仅含已知部分；本目标后续付费调用已停止。",ts:nowTs()});
      if(!res.ok){hint("追问失败："+((data&&data.error)||res.status));renderAll();return;}
      if(data.queued===true){
        log.push({role:"manager",ts:nowTs(),
          text:"这条消息已排进队列——任务还在跑，agent 跑完这一轮会回复，届时会在这里看到。"});
      }else{
        log.push({role:"manager",text:data.reply||data.output||"（无回复）",ts:nowTs()});
        if(data.warning)log.push({role:"manager",text:data.warning,ts:nowTs()});
      }
      renderAll();return;
    }
    // 第一轮必须由前端先生成 session id：进度轮询要靠它，而服务端的 id
    // 只随「这一轮的响应」回来 —— 那时这一轮已经结束了，等于整个第一轮
    // （最需要看进度的时候）什么都显示不了。服务端本来就接受客户端传的
    // session_id（sid = body.get("session_id") or uuid4()）。
    if(!S.chatSession)S.chatSession=newSessionId();
    startManagerProgress();
    const chatBody=JSON.stringify({session_id:S.chatSession,message:text,
      choice_answers:choiceAnswers||{}});
    S.pendingChoiceAnswers=null;
    res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:chatBody});
    stopManagerProgress();
    data=await res.json();drop();
    if(data.cost_complete===false)S.preChat.push({role:"manager",text:"API 费用未知，显示金额仅含已知部分；本目标后续付费调用已停止。",ts:nowTs()});
    if(!res.ok){hint("经理没接上："+((data&&data.error)||res.status));
      await restoreManagerSessions();
      // 服务端在落盘之前就拒了（忙/会话冲突）的话，这句话哪儿都不在了：
      // 输入框上面清空过，乐观插入的那行又被快照覆盖掉。只留一个空输入框
      // 和一句报错，等于让用户重打一遍。
      if(!S.preChat.some(m=>m.role==="user"&&m.text===text)){ta.value=text;autoGrow();}
      renderAll();return;}
    S.chatSession=data.session_id;
    if(data.status==="asking"){
      const questions=(data.questions||[]).filter(q=>q&&q.question);
      // 开放式问题没有选项时继续使用普通文本；只在真正可点击时显示卡片。
      if(questions.length&&questions.some(q=>(q.options||[]).length))
        S.preChat.push({role:"manager",text:"",ts:nowTs(),
          card:{kind:"choices",questions:questions,answers:{},frozen:false}});
      else
        S.preChat.push({role:"manager",text:data.question,ts:nowTs()});
    }
    else if(data.status==="confirm")
      S.preChat.push({role:"manager",ts:nowTs(),
        text:"确认一下——\n目标："+data.goal+"\n约束："+(data.constraints||"（无）")+
             "\n没问题回复“对/开始”；要改的话直接说哪里不对。"});
    else if(data.status==="started"){stopRestoredManagerPolling();stopManagerProgress();
      S.chatSession=null;
      S.preChat.push({role:"manager",text:"收到，马上安排开工。",ts:nowTs()});
      hint("已提交引擎，等待 Planner 拆解…");}
    renderAll();
  }catch(_){
    stopManagerProgress();
    drop();hint("连不上 serve.py —— 用 `python serve.py` 启动，或点右上角切到 DEMO");
    // 发送失败本身就是最直接的断连证据：立刻亮指示，不用等轮询攒够 3 次
    S.liveDown=true;renderLiveState();
    renderAll();
  }
  }finally{
    if(!Timers.running("session"))S.sendPending=false;
    renderAll();
  }
}

/* ---------- live polling ---------- */
let liveFail=0;
async function pollLive(){
  let res;
  try{
    res=await fetch("events.jsonl?nocache="+Date.now(),{cache:"no-store"});
  }catch(_){
    // 只有 fetch 本身抛异常（网络层失败）才算"连不上 serve.py"。
    // 拿到任何 HTTP 响应都说明服务端活着——404 是"这个项目还没跑过
    // 任何 run"的正常状态，不能当断连（否则全新安装一进来就红着报
    // "已断开"，而服务端其实好好的）。
    onLiveDown();return;
  }
  markLiveUp();
  if(!res.ok)return;    // 404 = 还没有 run，安静等着就行
  try{
    // per-run event files: when the server switches to a NEW run, its file
    // can be SHORTER than the previous one -- the byte offset must reset
    const runId=res.headers.get("X-AgentHub-Run")||"";
    if(runId&&runId!==S.runId){S.runId=runId;S.seenBytes=0;}
    const text=await res.text();
    if(text.length>S.seenBytes){
      const fresh=text.slice(S.seenBytes);S.seenBytes=text.length;
      for(const line of fresh.split("\n")){if(!line.trim())continue;
        try{ingest(JSON.parse(line))}catch(_){}}}
  }catch(_){ /* 响应读到一半断了：下一轮会重来，不改断连状态 */ }
}
function markLiveUp(){
  liveFail=0;
  if(S.liveDown){S.liveDown=false;renderLiveState();hint("已重新连上 serve.py");}
}
function onLiveDown(){
  // 连续 3 次失败 = serve.py 没了（进程退出/重启/机器睡醒）。
  // 以前这里的提示挂了 `&&!S.sessions.length` 的条件——只要跑过一次
  // 任务，服务端挂掉就完全静默：轮询每秒失败一次却什么都不显示，
  // 界面还挂着旧状态像是一切正常，用户要等到发任务失败才发现。
  // 现在无论有没有会话都亮断连指示；自动切 DEMO 仍然只在"还没有任何
  // 会话"时做（有真实历史时切 DEMO 会拿假数据盖住真记录）。
  if(++liveFail>=3&&!S.liveDown){
    S.liveDown=true;renderLiveState();
    if(!S.sessions.length&&!S.chatSession){
      setMode("demo");hint("连不上 serve.py，已切 DEMO —— 直接在下方输入目标试试");}
    else{
      hint("跟 serve.py 断开了 —— 重新运行 python3 serve.py（或双击启动器）后会自动恢复");}
  }
}
function renderLiveState(){
  const b=$("#mode-btn");if(!b)return;
  const down=S.liveDown&&S.mode==="live";
  b.classList.toggle("down",down);
  $("#mode-label").textContent=down?"已断开":(S.mode==="live"?"LIVE":"DEMO");
  b.title=down?"连不上 serve.py：进程可能已退出。重新启动后会自动恢复。":"";
}
function startLive(){Timers.start("live",pollLive,1000);pollLive();}
function setMode(m){S.mode=m;
  // 手动切换模式时清掉断连状态：切到 DEMO 后"断开"不再有意义，切回 LIVE
  // 要给它一次干净的重试机会（连不上的话 pollLive 会重新亮起来）
  S.liveDown=false;liveFail=0;renderLiveState();
  if(m==="live")startLive();else{
    stopRestoredManagerPolling();stopManagerProgress();
    Timers.stop("live");
  }}
$("#mode-btn").onclick=()=>setMode(S.mode==="live"?"demo":"live");

/* ---------- boot ---------- */
setTheme(S.theme);
if(!localStorage.getItem("ah_theme")&&window.matchMedia&&
   window.matchMedia("(prefers-color-scheme: light)").matches)setTheme("light");

$("#strip-label").textContent=S.strip?"收起":"展开";
